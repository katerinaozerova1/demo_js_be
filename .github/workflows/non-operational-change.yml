name: Add Non-Operational Change (Option B)

on:
  workflow_dispatch:

permissions:
  contents: write  # required to push commits

jobs:
  update-code:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # Step 1 — Checkout repository
      # ---------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------
      # Step 2 — Add a no-op semicolon inside the middleware
      # This changes the method hash without affecting functionality
      # ---------------------------------------
      - name: Add non-operational change
        run: |
          # Insert a semicolon inside the middleware function
          sed -i '/function middleware(req, res, next) {/{n;s/^/  ; \/\/ SL no-op change\n/}' index.js

      # ---------------------------------------
      # Step 3 — Commit the change
      # ---------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "chore: non-operational method hash change (Option B)" || echo "No changes to commit"

      # ---------------------------------------
      # Step 4 — Push the change
      # ---------------------------------------
      - name: Push changes
        run: |
          git push
