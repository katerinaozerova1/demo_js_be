name: Add Non-Operational Change

on:
  workflow_dispatch:

jobs:
  update-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add non-operational change to index.js
        run: |
          echo "// Non-operational change: updated at $(date)" >> index.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.js
          git commit -m "chore: non-operational change for SL test ($(date))" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
