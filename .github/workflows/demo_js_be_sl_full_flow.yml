# Copy to: .github/workflows/sealights-nodejs-onboarding.yml
# Repository: https://github.com/katerinaozerova1/demo_js_be
#
# Manual run: workflow_dispatch. Injects a per-run string constant (not a comment) into
# the request/response path so the file hash and SL "code change" views show real code.
# config → scan → start test session → run instrumented app → HTTP smoke tests → end session.

name: SeaLights NodeJS Onboarding

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sealights-onboarding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sealights:
    runs-on: ubuntu-latest

    env:
      SL_TOKEN: ${{ secrets.SL_TOKEN }}

    steps:
      # ---------------------------------------
      # Checkout
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ---------------------------------------
      # Node & npm
      # ---------------------------------------
      - name: Setup Node.js 18.20.8
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"

      - name: Upgrade npm to 10.8.2
        run: npm install -g npm@10.8.2

      - name: Install npm dependencies
        run: npm install

      - name: Ensure SeaLights Node agent (slnodejs)
        run: npm install slnodejs

      # ---------------------------------------
      # Operational (hash) change for SeaLights: real JS, not comments/whitespace
      # SL UI often does not count comment-only or blank edits as a "code" change. We inject
      # an executable const and reference it in middleware + GET / so the stamp is on a hot path.
      # Repeats every run with a new value: runId_attempt (content hash still changes each run).
      # ---------------------------------------
      - name: Inject per-run build stamp into application code
        run: |
          set -e
          node <<'PATCH'
          const fs = require("fs");
          const path = "index.js";
          const stamp = "run_${{ github.run_id }}_${{ github.run_attempt }}";
          let s = fs.readFileSync(path, "utf8");
          if (s.includes("__SL_DEMO_STAMP")) {
            s = s.replace(
              /const __SL_DEMO_STAMP = "[^"]*";/,
              `const __SL_DEMO_STAMP = ${JSON.stringify(stamp)};`
            );
            console.log("Updated existing __SL_DEMO_STAMP for this run");
          } else {
            if (!s.includes("const app = express();")) {
              console.error("index.js: expected 'const app = express();' — update the patcher");
              process.exit(1);
            }
            s = s.replace(
              "const app = express();",
              `const app = express();\nconst __SL_DEMO_STAMP = ${JSON.stringify(stamp)};`
            );
            s = s.replace(
              /res\.send\("Hello World!"\);/,
              "res.send(\"Hello World! \" + __SL_DEMO_STAMP);"
            );
            s = s.replace(
              /console\.log\("Middleware called"\);/,
              "console.log(\"Middleware called\", __SL_DEMO_STAMP);"
            );
          }
          if (!s.includes("__SL_DEMO_STAMP")) {
            console.error("Patch did not apply — check index.js format.");
            process.exit(1);
          }
          fs.writeFileSync(path, s);
          PATCH
          node -c index.js

      - name: Commit and push build stamp
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: SeaLights demo stamp in hot path (run ${{ github.run_id }})"
          git push

      # ---------------------------------------
      # SeaLights: build + scan
      # Use the branch the workflow runs on (usually main), not a hardcoded master.
      # ---------------------------------------
      - name: Initialize SeaLights build
        run: |
          npx slnodejs config \
            --token "$SL_TOKEN" \
            --appname "demo_js_be" \
            --branch "${{ github.ref_name }}" \
            --build "$(date +"%y%m%d_%H%M")"

      - name: SeaLights scan
        run: |
          npx slnodejs scan \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            --workspacepath "." \
            --scm none \
            --es6Modules

      # ---------------------------------------
      # Smoke test (Node 18+ built-in test runner) — created in CI, no repo change required
      # ---------------------------------------
      - name: Create HTTP smoke test
        run: |
          # SL_EXPECT_STAMP is set on the "Run app" step when executing node --test
          cat > smoke.test.mjs <<'EOF'
          import { test } from "node:test";
          import assert from "node:assert";
          import http from "http";
          const EXPECT = process.env.SL_EXPECT_STAMP || "";
          function get (path) {
            return new Promise((resolve, reject) => {
              const req = http.get(
                { hostname: "127.0.0.1", port: 3000, path, timeout: 10000 },
                (res) => {
                  let b = "";
                  res.on("data", (c) => { b += c; });
                  res.on("end", () => resolve({ status: res.statusCode, body: b }));
                }
              );
              req.on("error", reject);
              req.on("timeout", () => {
                req.destroy();
                reject(new Error("request timeout"));
              });
            });
          }
          test("GET / is 200 and body includes stamp (instrumented app)", async () => {
            for (let r = 0; r < 3; r++) {
              const { status, body } = await get("/");
              assert.equal(status, 200, `attempt ${r + 1} status`);
              assert.match(body, /Hello World!/, "response text");
              if (EXPECT) assert.ok(body.includes(EXPECT), "response must include build stamp: " + EXPECT);
            }
          });
          EOF

      # ---------------------------------------
      # Test session: start → run instrumented app → run tests → end
      # ---------------------------------------
      - name: Start SeaLights test session
        run: |
          npx slnodejs start \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            --teststage "Smoke Tests"

      - name: Run app under SeaLights and execute smoke tests
        env:
          SL_EXPECT_STAMP: "run_${{ github.run_id }}_${{ github.run_attempt }}"
        run: |
          set -e
          STAMP="run_${{ github.run_id }}_${{ github.run_attempt }}"
          nohup npx slnodejs run \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            -- index.js > app.log 2>&1 &
          echo $! > app.npx.pid
          for i in $(seq 1 60); do
            if OUT=$(curl -sS "http://127.0.0.1:3000/" 2>/dev/null) && \
              echo "$OUT" | grep -q "Hello World" && \
              echo "$OUT" | grep -qF "$STAMP"; then
              echo "App responded with expected body (stamped, instrumented path)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "App failed health check; last app.log:"
              tail -n 80 app.log 2>/dev/null || true
              echo "curl (verbose, last lines):"
              curl -sS "http://127.0.0.1:3000/" 2>&1 | head -c 500 || true
              echo
              (ss -tlnp 2>/dev/null || true) | grep 3000 || (netstat -tlnp 2>/dev/null | grep 3000) || true
              exit 1
            fi
            sleep 1
          done
          sleep 3
          for _ in 1 2 3; do
            curl -sS "http://127.0.0.1:3000/" > /dev/null
          done
          export SL_EXPECT_STAMP="${STAMP}"
          node --test smoke.test.mjs
          echo "Smoke tests passed"

      - name: End SeaLights test session
        if: always()
        run: |
          npx slnodejs end \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" || true

      - name: Stop background app
        if: always()
        run: |
          if [ -f app.npx.pid ]; then
            kill "$(cat app.npx.pid)" 2>/dev/null || true
          fi
          pkill -f "slnodejs run" 2>/dev/null || true
          pkill -f "index.js" 2>/dev/null || true
          echo "Stopped instrumented app"
