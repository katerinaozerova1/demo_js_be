name: SeaLights NodeJS Onboarding

on:
  workflow_dispatch:

jobs:
  sealights:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # Step 0 — Checkout source
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # Step 1 — Install required Node version & npm version
      # ---------------------------------------
      - name: Setup Node.js 18.20.8
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'

      - name: Upgrade npm to 10.8.2
        run: npm install -g npm@10.8.2

      # ---------------------------------------
      # Step 2 — Install application dependencies
      # ---------------------------------------
      - name: Install npm dependencies
        run: npm install

      # ---------------------------------------
      # Step 3 — Download SeaLights agent
      # ---------------------------------------
      - name: Install SeaLights Node agent
        run: npm install slnodejs

      # ---------------------------------------
      # Step 4 — Initialize SeaLights Build
      # ---------------------------------------
      - name: Initialize SeaLights Build
        env:
          SL_TOKEN: ${{ secrets.SL_TOKEN }}
        run: |
          npx slnodejs config \
            --token "$SL_TOKEN" \
            --appname "demo_js_be" \
            --branch "master" \
            --build "$(date +"%y%m%d_%H%M")"

      # ---------------------------------------
      # Step 5 — Scan application
      # ---------------------------------------
      - name: SeaLights Scan
        env:
          SL_TOKEN: ${{ secrets.SL_TOKEN }}
        run: |
          npx slnodejs scan \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            --workspacepath "." \
            --scm none \
            --es6Modules

      # ---------------------------------------
      # Step 6 — Start Test Session
      # ---------------------------------------
      - name: Start SeaLights Test Session
        env:
          SL_TOKEN: ${{ secrets.SL_TOKEN }}
        run: |
          npx slnodejs start \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            --teststage "Manual Tests"

      # ---------------------------------------
      # Step 7 — Run the app with SeaLights
      # ---------------------------------------
      - name: Run application with SeaLights
        env:
          SL_TOKEN: ${{ secrets.SL_TOKEN }}
        run: |
          nohup npx slnodejs run \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId" \
            -- index.js &

          echo "App running under SeaLights… waiting 90 seconds"
          sleep 90

      # ---------------------------------------
      # Step 7 — End Test Session
      # ---------------------------------------
      - name: End SeaLights Test Session
        env:
          SL_TOKEN: ${{ secrets.SL_TOKEN }}
        run: |
          npx slnodejs end \
            --token "$SL_TOKEN" \
            --buildsessionidfile "buildSessionId"
